spring:
  application:
    name: legal-collection-cs

  datasource:
    auth:
      jdbc-url: jdbc:postgresql://localhost:5433/auth
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    business:
      jdbc-url: jdbc:postgresql://localhost:5433/business
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    knowledge:
      jdbc-url: jdbc:postgresql://localhost:5433/knowledge
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    chat:
      jdbc-url: jdbc:postgresql://localhost:5433/chat
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    logs:
      jdbc-url: jdbc:postgresql://localhost:5433/logs
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: "legal-collection-cs-dev-secret-key-change-in-prod-0123456789abcdef"
    expiration-seconds: 86400
  model:
    name: deepseek-v4-pro
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY}
    timeout: 30s
  dashscope:
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    api-key: ${DASHSCOPE_API_KEY}
    connect-timeout: 3s
    read-timeout: 10s
    embedding:
      model: ${EMBEDDING_MODEL:qwen3-vl-embedding}
      dimension: 1024
    rerank:
      model: ${RERANK_MODEL:qwen3-rerank}
  memory:
    enabled: true
    top-k: 5
    similarity-threshold: 0.85
    retention-days: 90
    expire-interval-ms: 86400000

server:
  port: 8080
