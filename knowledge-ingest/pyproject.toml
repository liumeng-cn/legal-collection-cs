[project]
name = "knowledge-ingest"
version = "0.1.0"
description = "法催平台知识库离线入库管道：分块 + embedding + 写入 document_chunk"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
knowledge-ingest = "knowledge_ingest.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_ingest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_ingest"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.psycopg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
