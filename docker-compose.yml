services:
  postgres:
    build: ./db
    image: legal-collection-cs-postgres:pg16
    container_name: legal-collection-cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - legal-cs-pgdata:/var/lib/postgresql/data

volumes:
  legal-cs-pgdata:
